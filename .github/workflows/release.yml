# Dashboard release: every push to `master` —
#   1. bumps the app version in app.json (scripts/bump-version.js), picking the part from the
#      commit messages since the last vX.Y.Z tag: a `feat:` commit → minor (1.4.1 → 1.5.0),
#      `feat!:` or "BREAKING CHANGE" → major, otherwise patch (1.4.1 → 1.4.2),
#   2. commits it back to master and tags it `vX.Y.Z`,
#   3. starts a production build (.aab) on EAS and, once it finishes, submits it to the
#      Google Play **production** track (eas.json → submit.production). Google still reviews it.
#
# versionCode is separate: EAS auto-increments it (eas.json → appVersionSource: "remote").
# To force a part, run this workflow by hand (Actions → Dashboard release → Run workflow).
# Put `[skip release]` in the commit message on master to push without releasing.
#
# Needs the EXPO_TOKEN repo secret (expo.dev → Account settings → Access tokens) and the Google
# service account key stored on EAS — see docs/release.md. Branch protection on master must let
# GitHub Actions push the bump commit, or the bump step fails and no build starts.
name: Dashboard release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Releases take turns; a queued run checks out master again so it sees the previous bump.
concurrency:
  group: dashboard-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump version and build on EAS
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Branch protection on master only accepts PRs, so the bump is pushed with an admin's
      # fine-grained token (Contents: read & write on this repo), and admins may bypass the rule.
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.RELEASE_TOKEN }}
          # Full history and tags, so `auto` can read the commits since the last release.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repo secret (expo.dev → Access tokens)."
            exit 1
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Add the RELEASE_TOKEN repo secret (admin's fine-grained token, Contents: write) — see docs/release.md."
            exit 1
          fi

      - name: Bump version
        id: bump
        run: |
          VERSION=$(node scripts/bump-version.js "${{ inputs.bump || 'auto' }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing dashboard v$VERSION"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore: release v$VERSION [skip ci]"
          git pull --rebase -q origin master
          git tag "v$VERSION"
          # --atomic: if master rejects the bump, don't leave a tag behind pointing at nothing.
          git push --atomic origin HEAD:master "v$VERSION"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build and submit to Play production
        run: eas build -p android --profile production --auto-submit --non-interactive --no-wait
