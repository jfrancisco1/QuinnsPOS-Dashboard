# Type-check, lint and unit-test the dashboard on every pull request into `develop` or `master`.
# No build is made (pushes to develop/master run the same checks in preview.yml / release.yml).
# Runs on EAS (Expo Workflows) in the dashboard's Expo project (owner: jfrancisco2). Needs the
# GitHub repo linked there — see docs/release.md.
#
# Branch flow: feature/* → develop (preview APK) → master (Play release).
name: Dashboard checks

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  checks:
    name: Type-check, lint and test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
