# Manual only: an installable APK (`preview-android` profile) for testing on a phone.
# Pushes to `develop` don't build anything. Each run uses EAS build quota.
#
# Run it with `npm run preview:android` (builds the `develop` branch from GitHub), or
# `npx eas-cli@latest workflow:run .eas/workflows/preview.yml --ref <branch>` for another
# branch. Install the APK from the build page on expo.dev.
#
# Type-check, lint and tests run on GitHub Actions (.github/workflows/checks.yml), not here.
#
# android/ is gitignored, so EAS runs prebuild from app.json on every build.
name: Dashboard preview APK

on:
  workflow_dispatch: {}

jobs:
  build_apk:
    name: Build preview APK
    type: build
    params:
      platform: android
      profile: preview-android
