# Every push to `master`: a Play bundle (.aab, `production` profile), then upload to
# Google Play's production track. It goes live once Google's review passes — test the
# preview APK from `develop` before merging.
#
# Type-check, lint and tests run on GitHub Actions (.github/workflows/checks.yml), not here,
# and this build doesn't wait for them. Branch protection on `master` (PR + the
# "Type-check, lint and test" check) is what keeps a broken commit from being released.
#
# Bump `version` in app.json before merging a release. versionCode is incremented by EAS
# (`appVersionSource: "remote"` + `autoIncrement`). The upload needs the Google service
# account key stored on EAS — see docs/release.md.
name: Dashboard release

on:
  push:
    branches:
      - master

jobs:
  build_aab:
    name: Build Play bundle
    type: build
    params:
      platform: android
      profile: production

  submit_play:
    name: Upload to Play production
    needs: [build_aab]
    type: submit
    params:
      build_id: ${{ needs.build_aab.outputs.build_id }}
      profile: production
